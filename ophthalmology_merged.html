<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ophthalmology Master Exam - Batch 11</title>
    <style>
        :root { --p:#0f172a; --s:#3b82f6; --bg:#f8fafc; --cbg:#fff; --t:#1e293b; --m:#64748b; --c:#10b981; --cbg2:#d1fae5; --i:#ef4444; --ibg:#fee2e2; --b:#e2e8f0; --r:12px; --sh:0 4px 6px -1px rgba(0,0,0,0.1); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
        body { background:var(--bg); color:var(--t); line-height:1.6; }
        button { cursor:pointer; border:none; border-radius:8px; font-weight:600; transition:.2s; }
        .screen { display:none; max-width:1200px; margin:0 auto; padding:20px; }
        .screen.active { display:block; }
        .home-header { text-align:center; margin-bottom:30px; }
        .home-header h1 { font-size:2.5rem; color:var(--p); }
        .main-actions { display:flex; justify-content:center; gap:15px; margin-bottom:40px; flex-wrap:wrap; }
        .action-btn { padding:15px 30px; font-size:1.1rem; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .btn-missed { background:var(--cbg); border:2px solid var(--b); min-width:150px; }
        .btn-start { background:var(--p); color:#fff; font-size:1.3rem; min-width:200px; box-shadow:var(--sh); }
        .btn-resume { background:var(--cbg); border:2px solid var(--p); color:var(--p); min-width:180px; font-size:1rem; }
        .btn-resume .sub-text { font-size:.8rem; color:var(--m); font-weight:400; }
        .btn-reset { background:transparent; color:var(--i); border:1px solid var(--i); padding:8px 16px; margin:5px; font-size:.9rem; }
        .topic-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; margin-top:20px; }
        .topic-card { background:var(--cbg); padding:20px; border-radius:var(--r); box-shadow:var(--sh); border-left:5px solid var(--s); cursor:pointer; }
        .topic-card h3 { margin-bottom:5px; }
        .exam-header { display:flex; justify-content:space-between; align-items:center; background:var(--cbg); padding:15px; border-radius:var(--r); margin-bottom:20px; position:sticky; top:10px; z-index:10; box-shadow:var(--sh); flex-wrap:wrap; gap:10px; }
        .nav-controls { display:flex; gap:10px; flex-wrap:wrap; }
        .nav-btn { background:var(--bg); border:1px solid var(--b); padding:8px 15px; }
        .btn-copy { background:var(--s); color:#fff; padding:8px 15px; }
        .question-container { background:var(--cbg); padding:30px; border-radius:var(--r); box-shadow:var(--sh); margin-bottom:20px; }
        .question-text { font-size:1.2rem; font-weight:600; margin-bottom:20px; }
        .options-list { display:flex; flex-direction:column; gap:12px; }
        .option-item { padding:15px; background:var(--bg); border:2px solid var(--b); border-radius:8px; cursor:pointer; display:flex; }
        .option-item:hover { border-color:var(--s); }
        .option-item.correct { border-color:var(--c); background:var(--cbg2); }
        .option-item.incorrect { border-color:var(--i); background:var(--ibg); }
        .option-label { font-weight:700; margin-right:15px; }
        .short-note-container { margin-top:20px; }
        .btn-answer { background:var(--p); color:#fff; padding:10px 20px; }
        .answer-box { display:none; margin-top:15px; padding:15px; background:#f0fdf4; border-left:4px solid var(--c); }
        .answer-box.show { display:block; }
        .feedback-box { margin-top:20px; padding:20px; border-radius:8px; display:none; }
        .feedback-box.show { display:block; }
        .feedback-box.correct { background:var(--cbg2); border-left:4px solid var(--c); }
        .feedback-box.incorrect { background:var(--ibg); border-left:4px solid var(--i); }
        .collapsible-section { margin-top:10px; border:1px solid var(--b); border-radius:6px; background:var(--cbg); }
        .collapsible-header { padding:10px; background:var(--bg); cursor:pointer; font-weight:600; display:flex; justify-content:space-between; }
        .collapsible-content { display:none; padding:15px; border-top:1px solid var(--b); }
        .collapsible-content.show { display:block; }
        .navigator { display:flex; flex-wrap:wrap; gap:8px; padding:15px; background:var(--cbg); border-radius:var(--r); box-shadow:var(--sh); margin-bottom:20px; }
        .nav-num { width:35px; height:35px; display:flex; align-items:center; justify-content:center; border-radius:6px; border:1px solid var(--b); cursor:pointer; }
        .nav-num.current { border:2px solid var(--s); background:var(--s); color:#fff; }
        .nav-num.answered-correct { background:var(--c); color:#fff; }
        .nav-num.answered-incorrect { background:var(--i); color:#fff; }
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:1000; }
        .modal-overlay.active { display:flex; }
        .modal-content { background:#fff; padding:30px; border-radius:var(--r); text-align:center; }
        .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--p); color:#fff; padding:12px 24px; border-radius:8px; opacity:0; transition:.3s; pointer-events:none; }
        .toast.show { opacity:1; }
        .results-card { background:var(--cbg); padding:40px; border-radius:var(--r); text-align:center; max-width:600px; margin:50px auto; }
        .score-display { font-size:3rem; font-weight:700; color:var(--s); margin:20px 0; }
        .btn-home { background:var(--m); color:#fff; padding:8px 15px; }
    </style>
</head>
<body>
    <div id="toast" class="toast">Copied!</div>
    <div id="home-screen" class="screen active">
        <div class="home-header">
            <h1>Ophthalmology Master Exam</h1>
            <p>Batch 11 - Comprehensive Coverage (Duplicates Removed)</p>
        </div>
        <div class="main-actions">
            <button class="action-btn btn-missed" onclick="startMissedExam()">Missed Questions <span id="missed-count">(0)</span></button>
            <button class="action-btn btn-start" onclick="startNewExam()">Start Comprehensive Exam</button>
            <button class="action-btn btn-resume" id="resume-btn" onclick="resumeExam()">Resume <span class="sub-text" id="resume-info">No progress</span></button>
        </div>
        <div style="text-align:center">
            <button class="btn-reset" onclick="confirmResetQuestions()">Reset All Questions</button>
            <button class="btn-reset" onclick="confirmResetMissed()">Reset Missed Questions</button>
        </div>
        <div class="topic-grid" id="topic-grid"></div>
    </div>
    <div id="exam-screen" class="screen">
        <div class="exam-header">
            <div id="exam-title" style="font-weight:700">Section</div>
            <div class="nav-controls">
                <button class="nav-btn" onclick="prevQuestion()">Previous</button>
                <button class="btn-home" onclick="returnHome()">Return Home</button>
                <button class="btn-copy" onclick="copyQuestion()">Copy</button>
                <button class="nav-btn" onclick="nextQuestion()">Next</button>
                <button class="nav-btn" style="background:var(--p);color:#fff" onclick="finishExam()">Finish</button>
            </div>
        </div>
        <div class="navigator" id="navigator"></div>
        <div class="question-container">
            <div class="question-text" id="question-text"></div>
            <div class="options-list" id="options-list"></div>
            <div class="short-note-container" id="short-note-container" style="display:none">
                <button class="btn-answer" onclick="revealAnswer()">ANSWER</button>
                <div class="answer-box" id="answer-box"></div>
            </div>
            <div class="feedback-box" id="feedback-box">
                <div id="feedback-status" style="font-weight:700;margin-bottom:10px"></div>
                <div id="feedback-justification" style="margin-bottom:15px"></div>
                <div class="collapsible-section">
                    <div class="collapsible-header" onclick="toggleCollapsible('more-just')">More Justification (Why others are wrong) <span>▼</span></div>
                    <div class="collapsible-content" id="more-just"></div>
                </div>
                <div class="collapsible-section" id="book-ref-section">
                    <div class="collapsible-header" onclick="toggleCollapsible('book-ref')">Book Reference <span>▼</span></div>
                    <div class="collapsible-content" id="book-ref"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="results-screen" class="screen">
        <div class="results-card">
            <h2>Exam Completed!</h2>
            <div class="score-display" id="final-score">0%</div>
            <div style="display:flex;justify-content:center;gap:20px;margin-bottom:20px">
                <div><h4>Correct</h4><p id="stat-correct" style="color:var(--c);font-size:1.5rem;font-weight:700">0</p></div>
                <div><h4>Incorrect</h4><p id="stat-incorrect" style="color:var(--i);font-size:1.5rem;font-weight:700">0</p></div>
            </div>
            <div style="display:flex;justify-content:center;gap:15px">
                <button class="action-btn btn-start" style="padding:10px 20px;font-size:1rem" onclick="retryMissed()">Retry Missed</button>
                <button class="action-btn btn-resume" style="padding:10px 20px;font-size:1rem" onclick="goHome()">Return Home</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content">
            <h3 id="modal-title">Are you sure?</h3>
            <p id="modal-message" style="margin:15px 0"></p>
            <div style="display:flex;justify-content:center;gap:15px">
                <button class="btn-cancel" onclick="closeModal()" style="padding:10px 20px;border:1px solid #ccc">Cancel</button>
                <button class="btn-danger" id="modal-confirm-btn" style="padding:10px 20px;background:var(--i);color:#fff">Confirm</button>
            </div>
        </div>
    </div>

            },
            {
                "id": "qsn_1_Physiology_0",
                "type": "short_note",
                "q": "Mention FOUR evidences supporting the duplicity theory of Von Kries.",
                "ans": "1. Acuity of vision is more intense at the center of retina where cones are more distributed. 2. Vitamin A deficiency leads to night blindness but does not affect day vision. 3. Congenital absence of rods leads to night blindness. 4. Animals adapted for night life have rods only while those adapted for day life have cones only."
            },
            {
                "id": "qsn_1_Physiology_1",
                "type": "short_note",
                "q": "Mention FOUR changes that occur in photoreceptors on exposure to light.",
                "ans": "1. Rhodopsin is bleached (11-cis-retinal converts to all-trans-retinal). 2. Transducin is activated. 3. Phosphodiesterase is activated, leading to ↓ cGMP. 4. Na+ channels close, causing hyperpolarization."
            },
            {
                "id": "qsn_1_Physiology_2",
                "type": "short_note",
                "q": "Mention FOUR events responsible for maintaining photoreceptor depolarization in darkness.",
                "ans": "1. High intracellular cGMP concentration. 2. cGMP keeps Na+ channels open in the outer segment. 3. Continuous influx of Na+ (dark current). 4. Na+-K+-ATPase pump in the inner segment works at a slower rate than Na+ influx."
            },
            {
                "id": "qsn_1_Physiology_3",
                "type": "short_note",
                "q": "Mention FOUR causes of macular sparing in occipital lobe lesions.",
                "ans": "1. Dual blood supply from MCA and PCA. 2. Wide area of representation in the occipital cortex. 3. Macula is represented in both visual cortices. 4. Bilateral cortical representation of the macula."
            },
            {
                "id": "qsn_2_Eye_lid_0",
                "type": "short_note",
                "q": "Mention FOUR types of blepharitis.",
                "ans": "1. Squamous (non-ulcerative) blepharitis. 2. Ulcerative blepharitis. 3. Angular blepharitis. 4. Parasitic blepharitis."
            },
            {
                "id": "qsn_2_Eye_lid_1",
                "type": "short_note",
                "q": "Mention FOUR types of ptosis.",
                "ans": "1. Congenital (dystrophic or non-dystrophic). 2. Neurogenic (e.g., 3rd nerve palsy, Horner's). 3. Myogenic (e.g., Myasthenia gravis). 4. Aponeurotic (e.g., involutional/senile)."
            },
            {
                "id": "qsn_2_Eye_lid_2",
                "type": "short_note",
                "q": "Mention FOUR causes of cicatricial entropion.",
                "ans": "1. Trachoma. 2. Chemical and thermal burns. 3. Diphtheria. 4. Ocular cicatricial pemphigoid."
            },
            {
                "id": "qsn_2_Eye_lid_3",
                "type": "short_note",
                "q": "Mention FOUR complications of ulcerative blepharitis.",
                "ans": "1. Trichiasis (rubbing lashes due to scarring). 2. Madarosis (loss of lashes due to follicle destruction). 3. Marginal keratitis or pannus formation. 4. Epiphora due to destruction of the sharp posterior lid margin."
            },
            {
                "id": "qsn_3_Conjunctiva_0",
                "type": "short_note",
                "q": "Mention FOUR corneal manifestations of trachoma.",
                "ans": "1. Superficial keratitis with epithelial erosions. 2. Corneal follicles (Herbert's rosettes/pits). 3. Trachomatous pannus (superficial vascularization). 4. Typical trachomatous ulcer at the lower edge of the pannus."
            },
            {
                "id": "qsn_3_Conjunctiva_1",
                "type": "short_note",
                "q": "Mention FOUR complications of trachoma.",
                "ans": "1. Trachomatous trichiasis (TT). 2. Corneal opacity (CO) leading to blindness. 3. Cicatricial entropion. 4. Symblepharon and dry eye."
            },
            {
                "id": "qsn_3_Conjunctiva_2",
                "type": "short_note",
                "q": "Mention FOUR signs of vernal keratoconjunctivitis (VKC).",
                "ans": "1. Cobblestone papillae on the upper tarsal conjunctiva. 2. Trantas spots at the limbus. 3. Thick, whitish ropy mucoid discharge. 4. Shield ulcer or punctate epithelial erosions on the cornea."
            },
            {
                "id": "qsn_3_Conjunctiva_3",
                "type": "short_note",
                "q": "Mention FOUR causes of symblepharon.",
                "ans": "1. Chemical or thermal exposure (burns, acids, alkali). 2. Inflammation (membranous or pseudomembranous conjunctivitis). 3. Immune (mucous membrane pemphigoid). 4. Trauma (to the conjunctiva, traumatic or postoperative)."
            },
            {
                "id": "qsn_4_Lacrimal_System_0",
                "type": "short_note",
                "q": "Mention FOUR causes of epiphora.",
                "ans": "1. Functional: Lid malposition or weak lacrimal pump. 2. Punctal causes: Congenital absence or scarring. 3. Lacrimal sac causes: Dacryocystitis or tumors. 4. Nasolacrimal duct causes: Congenital non-recanalization or inflammatory stenosis."
            },
            {
                "id": "qsn_4_Lacrimal_System_1",
                "type": "short_note",
                "q": "Mention FOUR investigations for a case of epiphora.",
                "ans": "1. Regurge test (pressure over lacrimal sac). 2. Dye disappearance test (DDT). 3. Jones test (Type I and Type II). 4. Syringing and Probing."
            },
            {
                "id": "qsn_4_Lacrimal_System_2",
                "type": "short_note",
                "q": "Mention FOUR layers of the tear film and their secretors.",
                "ans": "1. Outer lipid layer: secreted by Meibomian glands. 2. Middle aqueous layer: secreted by main and accessory lacrimal glands. 3. Inner mucous layer: secreted by conjunctival goblet cells. 4. The tear film is distributed by normal lid blinking function."
            },
            {
                "id": "qsn_4_Lacrimal_System_3",
                "type": "short_note",
                "q": "Mention FOUR indications for DCR (Dacryocystorhinostomy).",
                "ans": "1. Epiphora secondary to NLDO. 2. Chronic dacryocystitis. 3. Mucocele of lacrimal sac. 4. Lacrimal fistula."
            },
            {
                "id": "qsn_5_Cornea_0",
                "type": "short_note",
                "q": "Mention FOUR anatomical factors of corneal transparency.",
                "ans": "1. Absence of blood and lymphatic vessels. 2. Stromal lamellae are regularly arranged and tightly packed. 3. Corneal epithelium is non-keratinized. 4. Corneal nerve fibers are non-myelinated."
            },
            {
                "id": "qsn_5_Cornea_1",
                "type": "short_note",
                "q": "Mention FOUR complications of corneal ulcer perforation.",
                "ans": "1. Anterior synechia or iris prolapse leading to leucoma adherent. 2. Anterior staphyloma. 3. Corneal fistula. 4. Anterior polar cataract or expulsive hemorrhage."
            },
            {
                "id": "qsn_5_Cornea_2",
                "type": "short_note",
                "q": "Mention FOUR signs of keratoconus.",
                "ans": "1. Progressive irregular astigmatism with frequent spectacle changes. 2. Fleischer ring (hemosiderin deposition at the base of the cone). 3. Vogt striae (vertical stromal striae). 4. Munson's sign (V-shaped lower lid in downgaze)."
            },
            {
                "id": "qsn_5_Cornea_3",
                "type": "short_note",
                "q": "Mention FOUR treatments for keratoconus.",
                "ans": "1. Glasses or rigid gas permeable (RGP) contact lenses for early cases. 2. Corneal cross-linking (CXL) using UV light and riboflavin. 3. Intracorneal ring segments (ICRS) to flatten the cone. 4. Keratoplasty (DALK or PKP) for advanced cases."
            },
            {
                "id": "qsn_6_Lens_0",
                "type": "short_note",
                "q": "Mention FOUR types of congenital cataract.",
                "ans": "1. Anterior polar cataract. 2. Posterior polar cataract. 3. Zonular (lamellar) cataract. 4. Total cataract (e.g., due to rubella)."
            },
            {
                "id": "qsn_6_Lens_1",
                "type": "short_note",
                "q": "Mention FOUR signs of intumescent cataract.",
                "ans": "1. Swollen lens due to water imbibition. 2. Shallow anterior chamber. 3. Glistening lens capsule. 4. Risk of secondary glaucoma (phacomorphic)."
            },
            {
                "id": "qsn_6_Lens_2",
                "type": "short_note",
                "q": "Mention FOUR causes of complicated cataract.",
                "ans": "1. Local ocular inflammation (e.g., iritis, hypopyon ulcer). 2. Retinal diseases (e.g., retinitis pigmentosa, retinal detachment). 3. Systemic diseases (e.g., diabetes mellitus, hypocalcemia). 4. Prolonged use of local corticosteroids or exposure to infrared radiation."
            },
            {
                "id": "qsn_6_Lens_3",
                "type": "short_note",
                "q": "Mention FOUR types of intraocular lenses (IOL) according to site of implantation.",
                "ans": "1. Anterior Chamber IOL (AC IOL) - angle fixed or iris fixed. 2. Posterior Chamber IOL (PC IOL) - in the bag. 3. Posterior Chamber IOL (PC IOL) - sulcus fixed. 4. Scleral fixed or iris sutured (iris claw lens)."
            },
            {
                "id": "qsn_7_Glaucoma_0",
                "type": "short_note",
                "q": "Mention FOUR optic disc findings in glaucoma.",
                "ans": "1. Increased cup-to-disc ratio (CDR > 0.7). 2. Asymmetry of cup size between eyes (difference > 0.2). 3. Vertical elongation of the cup. 4. Thinning or notching of the neurosensory rim."
            },
            {
                "id": "qsn_7_Glaucoma_1",
                "type": "short_note",
                "q": "Mention FOUR visual field changes in glaucoma.",
                "ans": "1. Nasal step (defect obeying the horizontal meridian). 2. Classic arcuate defect (following nerve fiber layer). 3. Paracentral scotoma. 4. Tunnel vision (generalized field constriction)."
            },
            {
                "id": "qsn_7_Glaucoma_2",
                "type": "short_note",
                "q": "Mention FOUR causes of secondary open angle glaucoma.",
                "ans": "1. Pseudoexfoliation glaucoma. 2. Pigmentary glaucoma. 3. Steroid-induced glaucoma. 4. Glaucoma associated with increased episcleral venous pressure (e.g., carotid-cavernous fistula)."
            },
            {
                "id": "qsn_7_Glaucoma_3",
                "type": "short_note",
                "q": "Mention FOUR signs of acute angle closure glaucoma.",
                "ans": "1. Rapid deterioration of visual acuity. 2. Markedly elevated IOP. 3. Corneal edema with colored halos. 4. Mid-dilated, vertically oval pupil with shallow anterior chamber (iris bombé)."
            },
            {
                "id": "qsn_8_Uveal_Tract_0",
                "type": "short_note",
                "q": "Mention FOUR types of uveitis (anatomical classification).",
                "ans": "1. Anterior uveitis (iritis, cyclitis, iridocyclitis). 2. Intermediate uveitis (pars planitis). 3. Posterior uveitis (choroiditis, retinitis, vasculitis). 4. Panuveitis (involvement of the entire uveal tract)."
            },
            {
                "id": "qsn_8_Uveal_Tract_1",
                "type": "short_note",
                "q": "Mention FOUR causes of uveitis.",
                "ans": "1. Immunological (e.g., HLA-B27 associated, Behcet's). 2. Infectious (e.g., TB, Syphilis, Herpes, Toxoplasmosis). 3. Idiopathic (no underlying systemic disease found). 4. Masquerade syndromes (e.g., retinoblastoma, intraocular lymphoma)."
            },
            {
                "id": "qsn_8_Uveal_Tract_2",
                "type": "short_note",
                "q": "Mention FOUR complications of anterior uveitis.",
                "ans": "1. Posterior synechiae leading to seclusio pupillae and iris bombe. 2. Secondary inflammatory glaucoma. 3. Complicated cataract (posterior subcapsular). 4. Cystoid macular edema or cyclitic membrane formation."
            },
            {
                "id": "qsn_8_Uveal_Tract_3",
                "type": "short_note",
                "q": "Mention FOUR features of Behcet's disease.",
                "ans": "1. Bilateral recurrent acute uveitis with hypopyon. 2. Oral ulceration. 3. Genital ulceration. 4. Positive pathergy (skin hyper-sensitivity) test."
            },
            {
                "id": "qsn_9_Retina_0",
                "type": "short_note",
                "q": "Mention FOUR clinical features of Central Retinal Artery Occlusion (CRAO).",
                "ans": "1. Sudden, painless, profound loss of vision. 2. Relative Afferent Pupillary Defect (RAPD). 3. Milky white retinal edema with a cherry-red spot at the macula. 4. Attenuated, thread-like retinal arteries with cattle-truck segmentation."
            },
            {
                "id": "qsn_9_Retina_1",
                "type": "short_note",
                "q": "Mention FOUR signs of proliferative diabetic retinopathy (PDR).",
                "ans": "1. Neovascularization of the disc (NVD). 2. Neovascularization elsewhere (NVE). 3. Vitreous hemorrhage. 4. Tractional retinal detachment."
            },
            {
                "id": "qsn_9_Retina_2",
                "type": "short_note",
                "q": "Mention FOUR complications of Central Retinal Vein Occlusion (CRVO).",
                "ans": "1. Cystoid macular edema (most common cause of vision loss). 2. Neovascularization of the iris/angle (rubeosis iridis). 3. Neovascular glaucoma (100-day glaucoma). 4. Vitreous hemorrhage or tractional retinal detachment."
            },
            {
                "id": "qsn_9_Retina_3",
                "type": "short_note",
                "q": "Mention FOUR causes of cherry-red spot at the macula.",
                "ans": "1. Central retinal artery occlusion (CRAO). 2. Tay-Sachs disease. 3. Niemann-Pick disease. 4. Gangliosidosis GM type II."
            },

                "id": "qsn_10_Optic_nerve_0",
                "type": "short_note",
                "q": "Mention FOUR causes of optic disc edema.",
                "ans": "1. Papilledema (due to increased intracranial pressure). 2. Optic neuritis (papillitis). 3. Central or branch retinal vein occlusion (CRVO/BRVO). 4. Malignant hypertension or hypotony."
            },
            {
                "id": "qsn_10_Optic_nerve_1",
                "type": "short_note",
                "q": "Mention FOUR signs of Horner's syndrome.",
                "ans": "1. Ptosis (mild, due to Muller's muscle paralysis). 2. Miosis (constricted pupil). 3. Anhidrosis (loss of sweating on the ipsilateral face). 4. Apparent enophthalmos (due to narrow palpebral fissure)."
            },
            {
                "id": "qsn_10_Optic_nerve_2",
                "type": "short_note",
                "q": "Mention FOUR causes of optic atrophy.",
                "ans": "1. Primary: Hereditary optic neuropathies (e.g., Leber's). 2. Secondary: Following optic disc edema (post-papilledemic or post-papillitic). 3. Consecutive: Following retinal disease (e.g., retinitis pigmentosa, CRAO). 4. Glaucomatous: Due to chronic loss of nerve fibers from high IOP."
            },
            {
                "id": "qsn_10_Optic_nerve_3",
                "type": "short_note",
                "q": "Mention FOUR causes of a swollen optic disc (true disc edema).",
                "ans": "1. Papilledema (increased intracranial pressure). 2. Papillitis (anterior optic neuritis). 3. Central retinal vein occlusion (CRVO). 4. Malignant hypertension or ocular hypotony."
            },
            {
                "id": "qsn_11_Strabismus_0",
                "type": "short_note",
                "q": "Mention FOUR types of manifest strabismus.",
                "ans": "1. Concomitant esotropia (e.g., infantile, accommodative). 2. Concomitant exotropia (e.g., intermittent, sensory). 3. Paralytic (incomitant) strabismus (e.g., 6th nerve palsy). 4. Restrictive strabismus (e.g., thyroid eye disease)."
            },
            {
                "id": "qsn_11_Strabismus_1",
                "type": "short_note",
                "q": "Mention FOUR signs of paralytic strabismus.",
                "ans": "1. Limitation of ocular movement in the direction of the paralyzed muscle. 2. Secondary angle of deviation is greater than the primary angle. 3. Compensatory abnormal head posture (face turn, chin elevation, or head tilt). 4. Binocular diplopia that increases in the direction of the paralyzed muscle."
            },
            {
                "id": "qsn_11_Strabismus_2",
                "type": "short_note",
                "q": "Mention FOUR features of essential infantile esotropia.",
                "ans": "1. Large angle of esotropia present since birth or early infancy. 2. Cross-fixation (using left eye for right visual field and vice versa). 3. Small or no refractive error. 4. Associated with dissociated vertical deviation (DVD) or latent nystagmus."
            },
            {
                "id": "qsn_11_Strabismus_3",
                "type": "short_note",
                "q": "Mention FOUR causes of amblyopia (lazy eye).",
                "ans": "1. Strabismic amblyopia (due to manifest deviation in one eye). 2. Refractive amblyopia (uncorrected high refractive error, especially anisometropia). 3. Stimulus deprivation amblyopia (e.g., complete ptosis, corneal opacity, congenital cataract). 4. Form deprivation due to media opacity."
            },
            {
                "id": "qsn_12_Orbit_0",
                "type": "short_note",
                "q": "Mention FOUR causes of proptosis.",
                "ans": "1. Thyroid eye disease (most common in adults). 2. Orbital cellulitis. 3. Orbital tumors (e.g., capillary hemangioma in children, cavernous hemangioma in adults). 4. Carotid-cavernous fistula."
            },
            {
                "id": "qsn_12_Orbit_1",
                "type": "short_note",
                "q": "Mention FOUR complications of orbital cellulitis.",
                "ans": "1. Ocular: Exposure keratopathy, raised IOP, optic nerve inflammation. 2. Orbital: Subperiosteal or orbital abscess. 3. Intracranial: Meningitis or brain abscess. 4. Intracranial: Cavernous sinus thrombosis."
            },
            {
                "id": "qsn_12_Orbit_2",
                "type": "short_note",
                "q": "Mention FOUR causes of enophthalmos.",
                "ans": "1. Small globe (microphthalmos or phthisis bulbi). 2. Structural bony abnormalities (e.g., blow-out fracture of orbital floor). 3. Atrophy of orbital contents (e.g., post-irradiation or scleroderma). 4. Cicatrizing orbital lesions (e.g., metastatic scirrhous carcinoma)."
            },
            {
                "id": "qsn_12_Orbit_3",
                "type": "short_note",
                "q": "Mention FOUR features of thyroid eye disease (TED).",
                "ans": "1. Lid retraction (upper lid margin above limbus). 2. Lid lag (Von Graefe sign) on downgaze. 3. Axial proptosis (usually bilateral but asymmetrical). 4. Restrictive myopathy (most commonly affecting inferior rectus)."
            },
            {
                "id": "qsn_13_Refractions_0",
                "type": "short_note",
                "q": "Mention FOUR complications of progressive (pathological) myopia.",
                "ans": "1. Retinal detachment (due to lattice degeneration and vitreous liquefaction). 2. Macular changes (e.g., Fuchs spot, choroidal neovascularization). 3. Consecutive optic atrophy. 4. Posterior staphyloma or early cataract formation."
            },
            {
                "id": "qsn_13_Refractions_1",
                "type": "short_note",
                "q": "Mention FOUR components of hypermetropia.",
                "ans": "1. Latent hypermetropia (masked by ciliary muscle tone, revealed by cycloplegia). 2. Manifest hypermetropia (not corrected by tone). 3. Facultative hypermetropia (can be overcome by accommodation). 4. Absolute hypermetropia (cannot be overcome by accommodation)."
            },
            {
                "id": "qsn_13_Refractions_2",
                "type": "short_note",
                "q": "Mention FOUR contraindications for laser refractive surgery.",
                "ans": "1. Very thin corneas or corneal ectasia (e.g., keratoconus). 2. Unstable refraction (changing prescription). 3. Active ocular surface disease (e.g., severe dry eye, active inflammation). 4. Systemic collagen vascular diseases or unpredictable healing (e.g., uncontrolled diabetes)."
            },
            {
                "id": "qsn_13_Refractions_3",
                "type": "short_note",
                "q": "Mention FOUR types of regular astigmatism.",
                "ans": "1. Simple myopic astigmatism (one meridian emmetropic, the other myopic). 2. Simple hyperopic astigmatism (one meridian emmetropic, the other hyperopic). 3. Compound myopic astigmatism (both meridians myopic but to different degrees). 4. Mixed astigmatism (one meridian myopic, the other hyperopic)."
            },
            {
                "id": "qsn_14_Trauma_0",
                "type": "short_note",
                "q": "Mention FOUR immediate effects of blunt ocular trauma.",
                "ans": "1. Traumatic hyphema (blood in anterior chamber). 2. Corneal edema or tears in Descemet's membrane. 3. Traumatic iridodialysis or sphincter tears. 4. Commotio retinae (Berlin's edema) or choroidal rupture."
            },
            {
                "id": "qsn_14_Trauma_1",
                "type": "short_note",
                "q": "Mention FOUR signs of sympathetic ophthalmia.",
                "ans": "1. History of penetrating trauma to one eye (exciting eye). 2. Bilateral granulomatous panuveitis. 3. Mutton-fat keratic precipitates (KPs) and iris nodules. 4. Dalen-Fuchs nodules or exudative retinal detachment in the sympathizing eye."
            },
            {
                "id": "qsn_14_Trauma_2",
                "type": "short_note",
                "q": "Mention FOUR manifestations of siderosis bulbi.",
                "ans": "1. Rusty discoloration of the lens (siderotic cataract). 2. Heterochromia (ipsilateral iris becomes darker). 3. Pigmentary retinopathy leading to profound visual loss. 4. Secondary open-angle glaucoma due to trabecular meshwork scarring."
            },
            {
                "id": "qsn_14_Trauma_3",
                "type": "short_note",
                "q": "Mention FOUR grades of acute chemical ocular surface burns (Roper-Hall classification).",
                "ans": "1. Grade I: Epithelial damage only, no limbal ischemia (Good prognosis). 2. Grade II: Hazy cornea, iris details visible, <1/3 limbal ischemia (Good prognosis). 3. Grade III: Total epithelial loss, stromal haziness blurring iris details, 1/3 to 1/2 limbal ischemia (Guarded prognosis). 4. Grade IV: Opaque cornea, >1/2 limbal ischemia (Bad prognosis)."
            },
            {
                "id": "qsn_15_Tumors_0",
                "type": "short_note",
                "q": "Mention FOUR differential diagnoses of leukocoria in infants.",
                "ans": "1. Retinoblastoma. 2. Congenital cataract. 3. Retinopathy of prematurity (ROP). 4. Persistent Hyperplastic Primary Vitreous (PHPV)."
            },
            {
                "id": "qsn_15_Tumors_1",
                "type": "short_note",
                "q": "Mention FOUR types of retinoblastoma according to growth pattern.",
                "ans": "1. Endophytic retinoblastoma (44%): grows into the vitreous. 2. Exophytic retinoblastoma (26%): grows towards the choroid. 3. Mixed type (29%). 4. Diffuse infiltrating retinoblastoma (1%): may present as uveitis (masquerade syndrome)."
            },
            {
                "id": "qsn_15_Tumors_2",
                "type": "short_note",
                "q": "Mention FOUR treatment modalities for retinoblastoma.",
                "ans": "1. Chemotherapy (intravitreal or intra-arterial via ophthalmic artery). 2. Heat (trans-pupillary thermotherapy - TTT). 3. Cold (cryotherapy for tumors anterior to the equator). 4. Radiotherapy (brachytherapy with radioactive plaques)."

            {
                "id": "qsn_15_Tumors_3",

                "id": "qsn_16_Systematic_diseases_0",

            },
            {
                "id": "qsn_16_Systematic_diseases_1",

                "q": "Mention FOUR ocular findings in Hypothyroidism.",
                "ans": "1. Puffiness of the eyelids (myxedema). 2. Madarosis (loss of the outer third of the eyebrow). 3. Dry eye syndrome. 4. Cortical cataract or papilledema (due to intracranial hypertension)."

            {

                "type": "short_note",
                "q": "Mention FOUR ocular features of Giant Cell Arteritis (GCA).",
                "ans": "1. Amaurosis fugax (transient monocular vision loss). 2. Arteritic anterior ischemic optic neuropathy (AION) with chalky white disc. 3. Pain around the eye with tender scalp. 4. Intermittent ophthalmoplegia and diplopia."
            },
            {
                "id": "qsn_17_Laser_0",
                "type": "short_note",
                "q": "Mention FOUR mechanisms of action of ophthalmic lasers.",
                "ans": "1. Photocoagulation: Converts light to heat to denature proteins (e.g., Argon). 2. Photodisruption: Giant pulse creates plasma for cutting (e.g., Nd:YAG). 3. Photoevaporation: Infrared heat absorbed by water to vaporize tissue (e.g., CO2). 4. Photodecomposition: Breaks chemical bonds to ablate tissue without heat (e.g., Excimer)."
            },
            {
                "id": "qsn_17_Laser_1",
                "type": "short_note",
                "q": "Mention FOUR common uses of lasers in ophthalmology.",
                "ans": "1. YAG laser for posterior capsulotomy (after cataract) and peripheral iridotomy (glaucoma). 2. Argon laser for pan-retinal photocoagulation (PDR) and sealing retinal tears. 3. Excimer/Femtosecond laser for refractive surgery (LASIK, PRK, SMILE). 4. CO2 laser for oculoplastic procedures (e.g., blepharoplasty, wart removal)."
            },
            {
                "id": "qsn_17_Laser_2",
                "type": "short_note",
                "q": "Mention FOUR complications of retinal photocoagulation.",
                "ans": "1. Accidental foveal burn leading to central vision loss. 2. Choroidal or retinal hemorrhage. 3. Macular edema or epiretinal membrane formation. 4. Constriction of visual fields or night blindness."
            },
            {
                "id": "qsn_17_Laser_3",
                "type": "short_note",
                "q": "Mention FOUR types of laser refractive surgery.",
                "ans": "1. LASIK (Laser in-situ keratomileusis) using microkeratome or femtosecond laser for flap. 2. PRK (Photo Refractive Keratectomy) where epithelium is removed mechanically. 3. LASEK (Laser Sub-epithelial Keratomileusis) using alcohol to create an epithelial flap. 4. FemtoSMILE using only femtosecond laser to create and extract a lenticule."
            },
            {
                "id": "qsn_18_Shortnote_0",

                "q": "Mention FOUR causes of unilateral sudden painless loss of vision.",
                "ans": "1. Central retinal artery occlusion (CRAO). 2. Amaurosis fugax (transient). 3. Massive vitreous hemorrhage. 4. Severe open eye injury."
            },
            {
                "id": "qsn_18_Shortnote_1",
                "type": "short_note",
                "q": "Mention FOUR causes of ciliary injection.",
                "ans": "1. Corneal ulcers or keratitis. 2. Acute angle-closure glaucoma. 3. Acute iridocyclitis (anterior uveitis). 4. Scleritis or episcleritis."
            },

                "id": "qsn_18_Shortnote_2",
                "type": "short_note",

// ==========================================
// APP LOGIC
// ==========================================
const LS_MISSED = 'ophtho_missed_questions';
const LS_SAVED_PROGRESS = 'ophtho_saved_progress';

let currentState = {
    sectionKey: null, questions: [], currentIndex: 0, answers: {},
    isMissedMode: false, isRetryMode: false
};

document.addEventListener('DOMContentLoaded', () => {
    renderHome();
    updateMissedCount();
    checkSavedProgress();
});

function renderHome() {
    const grid = document.getElementById('topic-grid');
    grid.innerHTML = '';
    for (const [key, section] of Object.entries(examData)) {
        if (key === 'doctors_exams' || key === 'short_notes') continue;
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.onclick = () => startSection(key);
        card.innerHTML = `<h3>${section.title}</h3><p>${section.questions.length} Questions</p>`;
        grid.appendChild(card);
    }
    const testCard = document.createElement('div');
    testCard.className = 'topic-card';
    testCard.style.borderLeftColor = 'var(--i)';
    testCard.onclick = () => startSection('doctors_exams');
    testCard.innerHTML = `<h3>${examData.doctors_exams.title}</h3><p>${examData.doctors_exams.questions.length} Questions</p>`;
    grid.appendChild(testCard);
    const snCard = document.createElement('div');
    snCard.className = 'topic-card';
    snCard.style.borderLeftColor = '#f59e0b';
    snCard.onclick = () => startSection('short_notes');
    snCard.innerHTML = `<h3>${examData.short_notes.title}</h3><p>${examData.short_notes.questions.length} Questions</p>`;
    grid.appendChild(snCard);
}

function updateMissedCount() {
    const missed = JSON.parse(localStorage.getItem(LS_MISSED) || '[]');
    document.getElementById('missed-count').innerText = `(${missed.length})`;
}

function checkSavedProgress() {
    const saved = localStorage.getItem(LS_SAVED_PROGRESS);
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            document.getElementById('resume-info').innerText = `${parsed.sectionTitle} - Q${parsed.currentIndex + 1}`;
            document.getElementById('resume-btn').style.display = 'flex';
        } catch (e) {
            document.getElementById('resume-btn').style.display = 'none';
        }
    } else {
        document.getElementById('resume-btn').style.display = 'none';
    }
}

function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    window.scrollTo(0, 0);
}

function startNewExam() {
    let allQuestions = [];
    for (const [key, section] of Object.entries(examData)) {
        if (key !== 'short_notes') allQuestions = allQuestions.concat(section.questions);
    }
    allQuestions = allQuestions.sort(() => Math.random() - .5);
    currentState = { sectionKey: 'all', questions: allQuestions, currentIndex: 0, answers: {}, isMissedMode: false, isRetryMode: false };
    document.getElementById('exam-title').innerText = `Comprehensive Exam`;
    switchScreen('exam-screen');
    renderQuestion();
    saveProgress(true);
}

function startSection(key) {
    currentState = { sectionKey: key, questions: [...examData[key].questions], currentIndex: 0, answers: {}, isMissedMode: false, isRetryMode: false };
    document.getElementById('exam-title').innerText = examData[key].title;
    switchScreen('exam-screen');
    renderQuestion();
    saveProgress(true);
}

function startMissedExam() {
    const missedIds = JSON.parse(localStorage.getItem(LS_MISSED) || '[]');
    if (missedIds.length === 0) { alert("No missed questions yet!"); return; }
    let missedQuestions = [];
    for (const [key, section] of Object.entries(examData)) {
        if (key !== 'short_notes') {
            section.questions.forEach(q => { if (missedIds.includes(q.id)) missedQuestions.push(q); });
        }
    }
    currentState = { sectionKey: 'missed', questions: missedQuestions, currentIndex: 0, answers: {}, isMissedMode: true, isRetryMode: false };
    document.getElementById('exam-title').innerText = `Missed Questions`;
    switchScreen('exam-screen');
    renderQuestion();
}

function resumeExam() {
    const saved = localStorage.getItem(LS_SAVED_PROGRESS);
    if (!saved) return;
    try {
        const parsed = JSON.parse(saved);
        currentState = parsed.state;
        document.getElementById('exam-title').innerText = parsed.sectionTitle;
        switchScreen('exam-screen');
        renderQuestion();
    } catch (e) { alert("Error resuming exam."); }
}

function saveProgress(silent = false) {
    if (currentState.sectionKey === 'short_notes' || currentState.questions.length === 0) return;
    const dataToSave = {
        sectionTitle: document.getElementById('exam-title').innerText.split(' - ')[0],
        state: currentState,
        currentIndex: currentState.currentIndex
    };
    localStorage.setItem(LS_SAVED_PROGRESS, JSON.stringify(dataToSave));
    if (!silent) showToast("Progress saved!");
    checkSavedProgress();
}

function returnHome() {
    saveProgress(true);
    goHome();
}

function renderQuestion() {
    const q = currentState.questions[currentState.currentIndex];
    if (!q) { finishExam(); return; }
    document.getElementById('exam-title').innerText =
        `${document.getElementById('exam-title').innerText.split(' - ')[0]} - Q${currentState.currentIndex + 1}/${currentState.questions.length}`;
    document.getElementById('question-text').innerText = q.q;
    const optionsList = document.getElementById('options-list');
    const shortNoteContainer = document.getElementById('short-note-container');
    const feedbackBox = document.getElementById('feedback-box');
    optionsList.innerHTML = '';
    feedbackBox.classList.remove('show', 'correct', 'incorrect');
    document.getElementById('answer-box').classList.remove('show');
    if (q.type === 'short_note') {
        optionsList.style.display = 'none';
        shortNoteContainer.style.display = 'block';
        document.getElementById('answer-box').innerText = q.ans;
    } else {
        optionsList.style.display = 'flex';
        shortNoteContainer.style.display = 'none';
        q.opts.forEach((opt, index) => {
            const el = document.createElement('div');
            el.className = 'option-item';
            el.innerHTML = `<span class="option-label">${String.fromCharCode(65 + index)}:</span> ${opt}`;
            if (currentState.answers[q.id] !== undefined) {
                if (index === q.ans) el.classList.add('correct');
                if (index === currentState.answers[q.id] && index !== q.ans) el.classList.add('incorrect');
                el.style.pointerEvents = 'none';
            } else {
                el.onclick = () => selectOption(q, index);
            }
            optionsList.appendChild(el);
        });
        if (currentState.answers[q.id] !== undefined) showFeedback(q, currentState.answers[q.id]);
    }
    renderNavigator();
}

function selectOption(q, selectedIndex) {
    if (currentState.answers[q.id] !== undefined) return;
    currentState.answers[q.id] = selectedIndex;
    const isCorrect = selectedIndex === q.ans;
    if (!isCorrect) {
        const missed = JSON.parse(localStorage.getItem(LS_MISSED) || '[]');
        if (!missed.includes(q.id)) {
            missed.push(q.id);
            localStorage.setItem(LS_MISSED, JSON.stringify(missed));
            updateMissedCount();
        }
    }
    const optionsList = document.getElementById('options-list');
    Array.from(optionsList.children).forEach((el, index) => {
        el.style.pointerEvents = 'none';
        if (index === q.ans) el.classList.add('correct');
        if (index === selectedIndex && !isCorrect) el.classList.add('incorrect');
    });
    showFeedback(q, selectedIndex);
    renderNavigator();
    saveProgress(true);
}

function showFeedback(q, selectedIndex) {
    const feedbackBox = document.getElementById('feedback-box');
    const isCorrect = selectedIndex === q.ans;
    feedbackBox.className = `feedback-box show ${isCorrect ? 'correct' : 'incorrect'}`;
    document.getElementById('feedback-status').innerText = isCorrect ? "✔ Correct!" : "✘ Incorrect";
    document.getElementById('feedback-status').style.color = isCorrect ? "var(--c)" : "var(--i)";
    document.getElementById('feedback-justification').innerText = q.just;
    document.getElementById('more-just').innerText = q.moreJust;
    const bookRefSection = document.getElementById('book-ref-section');
    if (q.ref && q.ref.trim() !== "") {
        document.getElementById('book-ref').innerText = q.ref;
        bookRefSection.style.display = 'block';
    } else {
        bookRefSection.style.display = 'none';
    }
    document.getElementById('more-just').classList.remove('show');
    document.getElementById('book-ref').classList.remove('show');
}

function revealAnswer() {
    document.getElementById('answer-box').classList.add('show');
}

function toggleCollapsible(id) {
    document.getElementById(id).classList.toggle('show');
}

function renderNavigator() {
    const nav = document.getElementById('navigator');
    nav.innerHTML = '';
    currentState.questions.forEach((q, index) => {
        const el = document.createElement('div');
        el.className = 'nav-num';
        el.innerText = index + 1;
        if (index === currentState.currentIndex) el.classList.add('current');
        else if (currentState.answers[q.id] !== undefined) {
            if (currentState.answers[q.id] === q.ans) el.classList.add('answered-correct');
            else el.classList.add('answered-incorrect');
        }
        el.onclick = () => { currentState.currentIndex = index; renderQuestion(); saveProgress(true); };
        nav.appendChild(el);
    });
}

function nextQuestion() {
    if (currentState.currentIndex < currentState.questions.length - 1) {
        currentState.currentIndex++;
        renderQuestion();
        saveProgress(true);
    }
}

function prevQuestion() {
    if (currentState.currentIndex > 0) {
        currentState.currentIndex--;
        renderQuestion();
        saveProgress(true);
    }
}

function copyQuestion() {
    const q = currentState.questions[currentState.currentIndex];
    let text = `Question: ${q.q}\n\n`;
    if (q.type === 'mcq') {
        q.opts.forEach((opt, i) => { text += `${String.fromCharCode(65 + i)}. ${opt}\n`; });
    } else {
        text += `Answer: ${q.ans}\n`;
    }
    navigator.clipboard.writeText(text).then(() => showToast("Copied!")).catch(err => console.error('Copy failed: ', err));
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

function finishExam() {
    let correct = 0, incorrect = 0, total = 0;
    currentState.questions.forEach(q => {
        if (q.type === 'mcq') {
            total++;
            const ans = currentState.answers[q.id];
            if (ans !== undefined && ans === q.ans) correct++;
            else incorrect++;
        }
    });
    if (total === 0) { goHome(); return; }
    const score = Math.round((correct / total) * 100);
    document.getElementById('final-score').innerText = `${score}%`;
    document.getElementById('stat-correct').innerText = correct;
    document.getElementById('stat-incorrect').innerText = incorrect;
    const retryBtn = document.querySelector('#results-screen button[onclick="retryMissed()"]');
    if (incorrect > 0) retryBtn.style.display = 'inline-block';
    else retryBtn.style.display = 'none';
    localStorage.removeItem(LS_SAVED_PROGRESS);
    checkSavedProgress();
    switchScreen('results-screen');
}

function retryMissed() {
    const missedInThisRun = currentState.questions.filter(q => {
        const ans = currentState.answers[q.id];
        return q.type === 'mcq' && (ans === undefined || ans !== q.ans);
    });
    if (missedInThisRun.length === 0) { alert("No questions to retry!"); return; }
    currentState = { sectionKey: 'retry', questions: missedInThisRun, currentIndex: 0, answers: {}, isMissedMode: false, isRetryMode: true };
    document.getElementById('exam-title').innerText = `Retry Missed Questions`;
    switchScreen('exam-screen');
    renderQuestion();
}

function goHome() {
    switchScreen('home-screen');
}

function confirmResetQuestions() {
    openModal(
        "Reset All Question Progress?",
        "This will clear all saved exam progress but keep your Missed Questions collection.",
        () => {
            localStorage.removeItem(LS_SAVED_PROGRESS);
            currentState = { sectionKey: null, questions: [], currentIndex: 0, answers: {}, isMissedMode: false, isRetryMode: false };
            checkSavedProgress();
            closeModal();
            showToast("Question progress reset.");
        }
    );
}

function confirmResetMissed() {
    openModal(
        "Reset Missed Questions?",
        "This will clear only your Missed Questions collection.",
        () => {
            localStorage.removeItem(LS_MISSED);
            updateMissedCount();
            closeModal();
            showToast("Missed questions reset.");
        }
    );
}

function openModal(title, message, onConfirm) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-message').innerText = message;
    const confirmBtn = document.getElementById('modal-confirm-btn');
    const newConfirmBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
    newConfirmBtn.onclick = onConfirm;
    document.getElementById('confirm-modal').classList.add('active');
}

function closeModal() {
    document.getElementById('confirm-modal').classList.remove('active');
}
</script>
